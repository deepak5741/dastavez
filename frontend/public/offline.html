<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Dastavez</title>
<meta name="theme-color" content="#0B6E66">
<style>
  :root { --bg: #fff; --ink: #0E2A2F; --muted: #586C6E; --accent: #0B6E66; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1618; --ink: #E4EEED; --muted: #93A8A9; --accent: #3CBFB0; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 700; margin: 0 auto 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 6px; max-width: 40ch; }
  button { margin-top: 18px; font: inherit; font-weight: 700; padding: 10px 20px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">द</div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on your phone yet. Guides you opened before still work without internet.</p>
    <p lang="hi">आप ऑफ़लाइन हैं। पहले खोली हुई गाइड बिना इंटरनेट भी चलती हैं।</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
