# Render Blueprint: free Postgres + one web service (Nuxt website and Deno API in one container).
# Deploy: https://render.com/deploy?repo=https://github.com/deepak5741/dastavez
databases:
  - name: dastavez-db
    plan: free
    databaseName: dastavez
    user: dastavez

services:
  - type: web
    name: dastavez
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dastavez-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
